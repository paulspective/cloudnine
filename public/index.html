<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudNine</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/x-icon" href="/favicons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
  <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="CloudNine">
  <meta name="theme-color" content="#f5f5f5" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-title" content="CloudNine">
</head>
<body>
  <h1 class="title">CloudNine</h1>

  <form class="change-location">
    <input type="text" name="city" class="city-input" placeholder="Enter city... weather or not">
  </form>

  <div class="recent-cities">
    <span></span>
    <div id="recentCitiesList"></div>
  </div>

  <div class="memory"></div>

  <div class="weather-wrapper hidden">
    <!-- Left: Today -->
    <div class="today"></div>

    <!-- Right: 5-day forecast -->
    <div class="forecast"></div>
  </div>

  <footer>
    Data provided by <a href="https://www.accuweather.com/" target="_blank">AccuWeather</a> • Built with 🖤
  </footer>

  <script type="module" src="/scripts/main.js"></script>
</body>
</html>
