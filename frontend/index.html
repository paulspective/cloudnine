<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudNine</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="../assets/favicons/favicon-96x96.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-touch-icon-180x180.png">
  <meta name="apple-mobile-web-app-title" content="CloudNine">
  <link rel="manifest" href="../manifest.json">
</head>
<body>
  <h1 class="title">CloudNine</h1>

  <form class="change-location">
    <input type="text" name="city" class="city-input" placeholder="Enter city... weather or not">
  </form>

  <div class="memory"></div>

  <div class="weather-wrapper hidden">
    <!-- Left: Today -->
    <div class="today"></div>

    <!-- Right: 5-day forecast -->
    <div class="forecast"></div>
  </div>

  <footer>
    Data provided by <a href="https://developer.accuweather.com/" target="_blank">AccuWeather</a> • Built with 🖤
  </footer>

  <script type="module" src="./scripts/main.js"></script>
</body>
</html>
